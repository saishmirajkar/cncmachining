  - {name: "Bharat Fritz Werner (BFW)", country: India, website: "https://www.bfwindia.com"}
  - {name: "Lakshmi Machine Works (LMW)", country: India, website: "https://www.lmwglobal.com"}
  - {name: "Ace Micromatic", country: India, website: "https://www.acemicromatic.net"}
