# Material grades with GENERIC STARTING cutting data. These ranges are typical values of the kind published in
# general machining handbooks; they are NOT tool-manufacturer recommendations and are labelled as such wherever
# they are used. Replace them with the tool manufacturer's data for production.
#   vc_m_min: [min, max] cutting speed for milling (m/min)
#   fz_by_d: [[diameter_mm, feed_per_tooth_mm], ...] milling, interpolated linearly
#   drill: {vc_m_min: [min, max], f_by_d: [[diameter_mm, feed_per_rev_mm], ...]}
#   engagement: slot_ap_over_d (full-width slotting), side_ap_over_d, pocket_stepover_pct, adaptive_stepover_pct
#   kc11 (N/mm^2) and mc: Kienzle specific cutting force, used only for an approximate power check.
source: "Generic starting values (typical handbook ranges). Not manufacturer-verified."
materials:
  - family: aluminium_alloy
    name: Wrought aluminium alloy
    iso_group: N
    grades:
      - designation: "6061-T6"
        standard: "ASTM B221 / EN AW-6061"
        equivalents: ["IS 733 65032 (indicative)"]
        condition: "T6"
        hardness: "~95 HB"
        density_kg_m3: 2700
        kc11_n_mm2: 700
        mc: 0.25
        cutting_data:
          carbide: {vc_m_min: [200, 400], fz_by_d: [[3, 0.02], [6, 0.04], [10, 0.06], [16, 0.08], [20, 0.10]],
