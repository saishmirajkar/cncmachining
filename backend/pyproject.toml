[project]
name = "cnc-platform-backend"
version = "0.1.0"
description = "CAD analysis, CAM orchestration, postprocessing and validation services for the CNC programming platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "freecad: requires the FreeCAD CAM runtime (FREECAD_PYTHON)",
  "postgres: requires a PostgreSQL database (TEST_DATABASE_URL)",
]
