# Production-style composition. Build the API image first (the worker image extends it):
#   docker compose -f deploy/docker-compose.yml build api && docker compose -f deploy/docker-compose.yml up -d
# Secrets come from deploy/.env (copy deploy/.env.example). Not executed in the development container.
name: cnc-platform

x-backend-env: &backend-env
  CNC_ENV: production
  CNC_DATABASE_URL: postgresql+psycopg://cnc:${POSTGRES_PASSWORD}@postgres:5432/cncplatform
  CNC_REDIS_URL: redis://redis:6379/0
  CNC_SECRET_KEY: ${CNC_SECRET_KEY}
  CNC_QUEUE_BACKEND: rq
  CNC_STORAGE_DIR: /data/storage
  CNC_TEMP_DIR: /data/tmp
  CNC_CORS_ORIGINS: '["${PUBLIC_ORIGIN}"]'
  CNC_CAM_TIMEOUT_S: "600"
  CNC_GEOMETRY_TIMEOUT_S: "180"
  CNC_CAM_MEMORY_LIMIT_MB: "4096"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cnc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cncplatform
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnc -d cncplatform"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  migrate:
    image: cnc-platform-api:latest
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed.seed"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [storage:/data]
    restart: "no"

  api:
    image: cnc-platform-api:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    volumes: [storage:/data]
    restart: unless-stopped

  worker:
    image: cnc-platform-worker:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    volumes: [storage:/data]
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "2", memory: 6g}
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
